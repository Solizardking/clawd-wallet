<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Clawd Wallet</title>
    <style>
      :root {
        --bg: #0a0a0a;
        --card: #111111;
        --line: rgba(153, 69, 255, 0.28);
        --fg: #e7edf5;
        --muted: #888888;
        --accent: #14f195;
        --accent2: #9945ff;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 340px;
        min-height: 220px;
        font: 13px/1.45 ui-sans-serif, system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
        padding: 16px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
      }
      .brand img {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        filter: drop-shadow(0 0 8px rgba(153, 69, 255, 0.45));
      }
      h1 { font-size: 18px; margin: 0; letter-spacing: 0.04em; }
      .sub { font-size: 11px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; }
      .sub a { color: var(--accent); text-decoration: none; }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 8px; }
      p { margin: 0 0 10px; }
      .muted { color: var(--muted); }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
        margin: 12px 0;
      }
      input, textarea, select {
        width: 100%;
        background: #0a0a0a;
        border: 1px solid var(--line);
        color: var(--fg);
        border-radius: 8px;
        padding: 9px 10px;
        margin: 4px 0;
        font: inherit;
      }
      select { width: auto; }
      button {
        background: #1a1a1a;
        color: var(--fg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 9px 12px;
        margin-top: 8px;
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        color: #0a0a0a;
        font-weight: 600;
        border: none;
        box-shadow: 0 0 14px rgba(20, 241, 149, 0.35);
      }
      button.ghost { background: transparent; }
      button.sm { padding: 4px 8px; margin: 0 0 0 6px; font-size: 12px; }
      .row { display: flex; gap: 8px; align-items: center; }
      .row.spread { justify-content: space-between; }
      .acct {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 0;
        border-bottom: 1px solid var(--line);
      }
      .acct .bal { margin-left: auto; }
      .acct.selected code { color: var(--accent); }
      code { font-family: ui-monospace, monospace; font-size: 12px; }
      code.block { display: block; padding: 6px 0; word-break: break-all; }
      .mnemonic {
        background: #0a0a0a;
        border: 1px dashed var(--accent2);
        border-radius: 10px;
        padding: 12px;
        font-family: ui-monospace, monospace;
        word-spacing: 4px;
        line-height: 1.8;
      }
      .mnemonic.small { font-size: 10px; word-break: break-all; max-height: 90px; overflow: auto; line-height: 1.4; }
      .error {
        background: #3a1620;
        border: 1px solid #7a2540;
        color: #ffd7e0;
        border-radius: 8px;
        padding: 8px 10px;
        margin-bottom: 10px;
      }
      .banner {
        background: rgba(153, 69, 255, 0.14);
        border: 1px solid var(--accent2);
        color: #e7d9ff;
        border-radius: 8px;
        padding: 8px 10px;
        margin: 10px 0;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="brand">
      <img src="icons/icon-48.png" alt="Clawd" />
      <div>
        <h1>CLAWD</h1>
        <div class="sub">SolGPT · <span style="color:#9945ff">Superintelligent Design</span><br /><a href="https://x402.life" target="_blank">x402.life</a> · <a href="https://solgpt.trade" target="_blank">solgpt.trade</a></div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
